version: 2

updates:
  # Backend Python
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "main"
    groups:
      python-patch:
        update-types:
          - "patch"
      python-minor:
        update-types:
          - "minor"
    ignore:
      # passlib 1.7.4 est incompatible avec bcrypt 4.x+, ne pas bumper bcrypt
      - dependency-name: "bcrypt"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Sauts majeurs à gérer manuellement
      - dependency-name: "fastapi"
        update-types: ["version-update:semver-major"]
      - dependency-name: "starlette"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pydantic"
        update-types: ["version-update:semver-major"]
      - dependency-name: "sqlalchemy"
        update-types: ["version-update:semver-major"]

  # Frontend npm
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "main"
    groups:
      npm-patch:
        update-types:
          - "patch"
      npm-minor:
        update-types:
          - "minor"
    ignore:
      # Expo SDK upgrade : à faire manuellement via `npx expo upgrade`
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-native"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      # Outils de build : majeurs à gérer manuellement
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  # Docker
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "main"
