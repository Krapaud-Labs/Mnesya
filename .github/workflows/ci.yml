name: CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt ruff pip-audit
      - run: python -m compileall -q app
      - run: ruff check app
      - run: pip-audit -r requirements.txt
      - name: Backend tests
        working-directory: .
        run: docker compose -f docker/docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from tests
      - name: Clean test services
        if: always()
        working-directory: .
        run: docker compose -f docker/docker-compose.test.yml down -v

  frontend:
    name: Frontend tests, typecheck and security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npx eslint src
      - run: npx tsc --noEmit
      - run: npm test -- --runInBand
      - run: npm audit --audit-level=high

  docker:
    name: Docker configuration validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker/docker-compose.test.yml config
      - run: docker compose -f docker/docker-compose.prod.yml --env-file docker/.env.example config
